name: Build

on: [ push ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Download Source file
        uses: actions/checkout@v6
        with:
          ref: source
          fetch-depth: 0

      - name: Prepare Node env
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"

      - name: Vuepress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yarn
          yarn run docs:build
          cp README.md docs/.vuepress/dist
          cd docs/.vuepress/dist
          git config --global user.name 'Fluid-dev'
          git config --global user.email 'a.fake.account@github.com'
          git init
          git add -A
          git commit -m 'Update'
          git push -f https://x-access-token:${GITHUB_TOKEN}@github.com/fluid-dev/hexo-fluid-docs.git master

      - name: Prepare artifacts for COS
        run: |
          rm -rf ./docs/.vuepress/dist/.git
          grep -rl 'hexo-fluid-docs' ./docs/.vuepress/dist | xargs -r sed -i 's/\/hexo-fluid-docs\//\/docs\//g'

      - name: Upload to COS
        uses: zkqiang/tencent-cos-action@v1
        with:
          commands: |
            rm -r -f cos://default/docs/
            cp -r ./docs/.vuepress/dist/ cos://default/docs/
          secret_id: ${{ secrets.COS_SECRET_ID }}
          secret_key: ${{ secrets.COS_SECRET_KEY }}
          bucket: ${{ secrets.COS_BUCKET }}
          region: ${{ secrets.COS_REGION }}
